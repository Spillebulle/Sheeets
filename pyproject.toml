[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheeets"
description = "Cut a part out of a scanned score and set it as its own sheet music."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8.0"]

[project.scripts]
sheeets = "sheeets.cli:main"

[tool.setuptools.dynamic]
version = {attr = "sheeets.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
